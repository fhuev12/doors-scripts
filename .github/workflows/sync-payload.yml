name: sync-payload

on:
  push:
    paths:
      - '.github/workflows/sync-payload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download encoded payload
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/kI7fMNHVjx" -o payload.b64
          echo "bytes: $(wc -c < payload.b64)"

      - name: Commit payload
        run: |
          git config user.name "payload-bot"
          git config user.email "payload-bot@users.noreply.github.com"
          git add payload.b64
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: 更新 payload"
          git push
